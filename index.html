<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://raw.githubusercontent.com; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#6d5dfc" />
    <title>کانفیگ‌های روانی‌ترین روانشناس </title>
    <link rel="icon" href="logo.ico" />
    <style>
      :root {
        --bg1: #f3f0ff;
        --bg2: #ffeaf4;
        --card: #ffffff;
        --text: #231a45;
        --muted: #5f5a7d;
        --gray: #6b6b7b;
        --border: #e1dbf3;
        --accent: #6d4cf5;
        --accent2: #e0409a;
        --accent-text: #ffffff;
        --ok: #15803d;
        --warn-bg: #fef3c7;
        --warn-text: #78350f;
        --warn-border: #f59e0b;
        --err-border: #ef4444;
        --shadow: 0 6px 22px rgba(70, 40, 140, 0.1);
        --radius: 18px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg1: #100d26;
          --bg2: #24112f;
          --card: #1b1838;
          --text: #f1eeff;
          --muted: #b4afd6;
          --gray: #a09cb8;
          --border: #33305f;
          --accent: #9d8cff;
          --accent2: #ff7ac0;
          --accent-text: #120e2b;
          --ok: #4ade80;
          --warn-bg: #3a2a08;
          --warn-text: #fde68a;
          --warn-border: #b7791f;
          --err-border: #b91c1c;
          --shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
        overflow-x: clip;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: clip;
        color: var(--text);
        font-family:
          "Vazirmatn",
          "Segoe UI",
          Tahoma,
          system-ui,
          -apple-system,
          Roboto,
          Arial,
          sans-serif;
        font-size: 17px;
        line-height: 1.7;
        background:
          radial-gradient(
            600px 400px at 90% -5%,
            color-mix(in srgb, var(--accent) 22%, transparent),
            transparent 70%
          ),
          radial-gradient(
            500px 380px at 5% 10%,
            color-mix(in srgb, var(--accent2) 20%, transparent),
            transparent 70%
          ),
          linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      .wrap {
        max-width: 820px;
        margin: 0 auto;
        min-width: 0;
        padding-inline: max(
          16px,
          env(safe-area-inset-left),
          env(safe-area-inset-right)
        );
      }
      [hidden] {
        display: none !important;
      }
      .ltr {
        direction: ltr;
        unicode-bidi: isolate;
        text-align: left;
      }
      /* a phrase never splits across lines */
      .ph {
        white-space: nowrap;
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
      }

      /* ---------- entrance animation: rise from below ---------- */
      .rise {
        opacity: 0;
        transform: translateY(32px);
        animation: rise 0.8s cubic-bezier(0.2, 0.75, 0.2, 1) both;
        animation-delay: calc(var(--i, 0) * 160ms);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(32px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ---------- header (everything centered) ---------- */
      header.hero {
        padding: 32px 0 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      header.hero > * {
        max-width: 100%;
      }
      .logo-wrap {
        display: block;
        line-height: 0;
      }
      .logo {
        width: 92px;
        height: 92px;
        object-fit: contain;
        padding: 10px;
        border-radius: 26px;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        animation: beat 2.4s 1.4s ease-in-out infinite;
      }
      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }
      .hero h1 {
        margin: 18px auto 6px;
        width: 100%;
        max-width: 560px;
        font-size: clamp(1.3rem, 5.6vw, 2.1rem);
        line-height: 1.75;
        font-weight: 800;
        padding-block: 0.1em;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
      .hero h1 .h1-inner {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: baseline;
        column-gap: 0.35em;
      }
      .hero .note {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: baseline;
        column-gap: 0.35em;
        margin: 0 auto 10px;
        width: 100%;
        max-width: 480px;
        text-align: center;
        font-size: clamp(0.88rem, 3.3vw, 1rem);
        line-height: 1.8;
        font-weight: 500;
        color: var(--gray);
      }
      .hero .sub {
        display: flex;
        justify-content: center;
        margin: 0 auto;
        width: 100%;
        max-width: 480px;
        text-align: center;
        font-size: clamp(1rem, 3.8vw, 1.25rem);
        font-weight: 600;
        color: var(--muted);
      }
      .steps {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin: 20px 0 0;
        padding: 0;
        list-style: none;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        font-size: 0.95rem;
        font-weight: 600;
      }
      .step b {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-text);
        font-size: 0.85rem;
      }
      .meta {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .pill {
        padding: 4px 14px;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--border);
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--muted);
      }
      .pill.count {
        color: var(--text);
      }

      /* ---------- banner ---------- */
      .banner {
        margin: 12px 0;
        padding: 14px 16px;
        border-radius: 14px;
        border: 2px solid var(--warn-border);
        background: var(--warn-bg);
        color: var(--warn-text);
      }
      .banner strong {
        display: block;
        font-size: 1.05rem;
      }

      /* ---------- sticky bar ---------- */
      .bar {
        position: sticky;
        top: 0;
        z-index: 10;
        padding: 10px 0;
      }
      .bar-inner {
        background: color-mix(in srgb, var(--card) 92%, transparent);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 12px;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        padding: 8px 18px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--card);
        font-weight: 700;
        transition:
          transform 0.15s,
          box-shadow 0.15s,
          background 0.2s;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
      .btn.primary {
        background: linear-gradient(
          90deg,
          var(--accent),
          color-mix(in srgb, var(--accent) 60%, var(--accent2))
        );
        color: var(--accent-text);
        border-color: transparent;
      }
      .btn.big {
        min-height: 60px;
        font-size: 1.2rem;
        width: 100%;
        border-radius: 16px;
      }
      .btn.small {
        min-height: 44px;
        padding: 6px 14px;
        font-size: 0.95rem;
      }
      .btn.done {
        background: var(--ok) !important;
        color: #fff !important;
      }

      .field {
        position: relative;
        flex: 1 1 160px;
        min-width: 0;
      }
      .search {
        width: 100%;
        min-height: 46px;
        padding: 8px 16px;
        padding-inline-end: 44px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--bg1);
      }
      .clear {
        position: absolute;
        inset-block: 0;
        inset-inline-end: 6px;
        width: 36px;
        margin: auto;
        height: 36px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        font-size: 1.1rem;
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 2px 0 4px;
        scrollbar-width: thin;
        min-width: 0;
      }
      .chip {
        flex: 0 0 auto;
        min-height: 40px;
        padding: 4px 16px;
        border-radius: 999px;
        border: 2px solid var(--c, var(--accent));
        background: var(--card);
        font-weight: 700;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .chip[aria-pressed="true"] {
        background: var(--c, var(--accent));
        color: #fff;
      }

      /* ---------- cards ---------- */
      main {
        padding: 10px 0 48px;
      }
      .list {
        display: grid;
        gap: 12px;
        padding: 0;
        margin: 0;
        list-style: none;
      }
      .card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-inline-start: 8px solid var(--c);
        border-radius: var(--radius);
        padding: 14px 16px;
        box-shadow: var(--shadow);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .card:hover {
        transform: translateY(-2px);
      }
      .card .info {
        min-width: 0;
      }
      .badge {
        display: inline-block;
        padding: 1px 12px;
        border-radius: 999px;
        background: var(--c);
        color: #fff;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .name {
        margin: 4px 0 0;
        font-weight: 800;
        font-size: 1.1rem;
        overflow-wrap: anywhere;
      }
      .host {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        overflow-wrap: anywhere;
      }
      .link {
        margin: 4px 0 0;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.78rem;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .card .btn {
        min-width: 120px;
        min-height: 54px;
        font-size: 1.05rem;
      }
      @media (max-width: 520px) {
        .card {
          grid-template-columns: minmax(0, 1fr);
        }
        .card .btn {
          width: 100%;
        }
      }

      /* ---------- states ---------- */
      .panel {
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 34px 20px;
        box-shadow: var(--shadow);
      }
      .panel .emoji {
        font-size: 3.2rem;
        line-height: 1;
      }
      .panel h2 {
        margin: 10px 0 6px;
      }
      .panel p {
        margin: 0 auto 18px;
        max-width: 460px;
        color: var(--muted);
      }
      .panel.error {
        border-color: var(--err-border);
      }
      .panel .row {
        justify-content: center;
      }
      .skel {
        height: 98px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        margin-bottom: 12px;
        background: linear-gradient(
          90deg,
          var(--card) 25%,
          var(--bg1) 50%,
          var(--card) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.3s linear infinite;
      }
      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }
      details.skipped {
        margin-top: 22px;
        color: var(--muted);
        font-size: 0.92rem;
      }
      details.skipped summary {
        cursor: pointer;
        padding: 6px 0;
      }
      details.skipped ul {
        margin: 8px 0 0;
        padding-inline-start: 22px;
        overflow-wrap: anywhere;
      }

      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(22px + env(safe-area-inset-bottom));
        transform: translate(-50%, 24px);
        opacity: 0;
        pointer-events: none;
        background: var(--text);
        color: var(--bg1);
        padding: 12px 22px;
        border-radius: 999px;
        font-weight: 700;
        box-shadow: var(--shadow);
        z-index: 50;
        transition:
          opacity 0.25s,
          transform 0.25s;
        max-width: 92vw;
        text-align: center;
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* ---------- small phones ---------- */
      @media (max-width: 480px) {
        .steps {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          width: 100%;
          max-width: 320px;
          gap: 8px;
        }
        .step {
          justify-content: flex-start;
        }
        .row .btn.small {
          flex: 1 1 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
        .rise {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <span class="logo-wrap rise" style="--i: 0"
          ><img
            class="logo"
            id="logo"
            src="logo.ico"
            alt=""
            width="92"
            height="92"
        /></span>
        <h1 class="rise" style="--i: 1">
          <span class="h1-inner">
            <span class="ph">این سایت برای نگه‌داری</span>
            <span class="ph">کانفیگ‌های</span>
            <span class="ph">روانی‌ترین روان‌شناس دنیاست</span>
          </span>
        </h1>
        <p class="note rise" style="--i: 2">
          <span class="ph">(اگه شناسنامه‌شو فتوشاپ نکرده باشه</span>
          <span class="ph"> اسمش سعیده‌ست)</span>
        </p>
        <p class="sub rise" style="--i: 3">کانفیگ‌ها هر روز آپدیت می‌شن</p>
        <ol class="steps rise" style="--i: 4" aria-label="راهنمای استفاده">
          <li class="step"><b>۱</b> روی «کپی» بزن</li>
          <li class="step"><b>۲</b> برنامه‌ت رو باز کن</li>
          <li class="step"><b>۳</b> جایگذاری (Paste) کن</li>
        </ol>
        <div class="meta rise" style="--i: 5">
          <span class="pill count" id="count" aria-live="polite"
            >در حال بارگذاری…</span
          >
          <span class="pill" id="updated" hidden></span>
        </div>
      </header>

      <div id="banner" class="banner" role="alert" hidden></div>

      <div class="bar rise" style="--i: 6">
        <div class="bar-inner">
          <button class="btn primary big" id="copyAll" type="button" disabled>
            کپی همه کانفیگ‌ها
          </button>
          <div class="row">
            <div class="field">
              <input
                class="search"
                id="search"
                type="search"
                placeholder="🔍 جستجوی نام یا سرور…"
                aria-label="جستجو در کانفیگ‌ها"
                autocomplete="off"
                disabled
              />
              <button
                class="clear"
                id="clear"
                type="button"
                aria-label="پاک کردن جستجو"
                hidden
              >
                ✕
              </button>
            </div>
            <button class="btn small" id="refresh" type="button">
              ↻ به‌روزرسانی
            </button>
          </div>
          <div
            class="chips"
            id="chips"
            role="group"
            aria-label="فیلتر بر اساس نوع"
            hidden
          ></div>
        </div>
      </div>

      <main>
        <section id="loading" aria-label="در حال بارگذاری" hidden>
          <div class="skel"></div>
          <div class="skel"></div>
          <div class="skel"></div>
          <div class="skel"></div>
        </section>
        <section id="status" hidden></section>
        <ul class="list" id="list" hidden></ul>
        <details class="skipped" id="skipped" hidden>
          <summary id="skippedSummary"></summary>
          <ul id="skippedList"></ul>
        </details>
      </main>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script>
      // ============================================================
      // CONFIGURATION (owner edits this one line before deploying).
      // Paste the RAW URL of your .txt file, e.g.
      //   https://raw.githubusercontent.com/USER/REPO/main/configs.txt
      // The host MUST also appear in connect-src of the Content-Security-Policy <meta> above.
      // ============================================================
      const CONFIG_SOURCE_URL =
        "https://raw.githubusercontent.com/callmeEBi/VPN/refs/heads/main/webconfigs.txt";

      const PLACEHOLDER = "PASTE_THE_RAW_TXT_URL_HERE";
      const TIMEOUT_MS = 15000;
      const PROTO_COLORS = {
        vmess: "#7c3aed",
        vless: "#0369a1",
        trojan: "#be123c",
        ss: "#15803d",
        hysteria2: "#c2410c",
        tuic: "#a21caf",
        other: "#475569",
      };

      (function () {
        "use strict";
        const $ = (id) => document.getElementById(id);
        const fa = (n) => Number(n).toLocaleString("fa-IR");
        const state = {
          items: [],
          skipped: [],
          active: "all",
          query: "",
          animate: true,
        };
        let loadId = 0,
          controller = null,
          toastTimer = null;

        // ---------- DOM helpers (textContent only; never innerHTML) ----------
        function el(tag, opts, kids) {
          const n = document.createElement(tag);
          if (opts) {
            if (opts.cls) n.className = opts.cls;
            if (opts.text != null) n.textContent = opts.text;
            if (opts.attrs)
              for (const k in opts.attrs) n.setAttribute(k, opts.attrs[k]);
          }
          (kids || []).forEach((k) => n.appendChild(k));
          return n;
        }
        function clear(n) {
          while (n.firstChild) n.removeChild(n.firstChild);
        }
        const labelOf = (p) => (p === "other" ? "سایر" : p);

        // ---------- Parsing ----------
        const SCHEME_RE = /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//;

        function safeDecodeURI(s) {
          try {
            return decodeURIComponent(s);
          } catch (e) {
            return s;
          }
        }
        function safeBase64(str) {
          try {
            let s = String(str)
              .replace(/\s+/g, "")
              .replace(/-/g, "+")
              .replace(/_/g, "/");
            while (s.length % 4) s += "=";
            const bin = atob(s);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder("utf-8").decode(bytes);
          } catch (e) {
            return null;
          }
        }
        function hostOf(raw) {
          try {
            const u = new URL(raw);
            if (u.hostname) return u.hostname + (u.port ? ":" + u.port : "");
          } catch (e) {
            /* fall through */
          }
          const m = raw.match(/@([^\/:?#@]+)(?::(\d+))?/);
          return m ? m[1] + (m[2] ? ":" + m[2] : "") : "";
        }
        function describe(raw, proto) {
          let name = "",
            host = "";
          if (proto === "vmess") {
            const payload = raw.slice(raw.indexOf("://") + 3).split(/[#?]/)[0];
            const json = safeBase64(payload);
            if (json) {
              try {
                const o = JSON.parse(json);
                if (o && typeof o === "object") {
                  if (typeof o.ps === "string") name = o.ps.trim();
                  if (o.add)
                    host = String(o.add) + (o.port ? ":" + o.port : "");
                }
              } catch (e) {
                /* malformed JSON: fall back */
              }
            }
            if (!name)
              name = host
                ? "کانفیگ VMess"
                : "کانفیگ VMess (اطلاعات خوانا نیست)";
          } else {
            const h = raw.indexOf("#");
            if (h !== -1) name = safeDecodeURI(raw.slice(h + 1)).trim();
            host = hostOf(raw);
            if (
              proto === "ss" &&
              (!host || raw.split("#")[0].indexOf("@") === -1)
            ) {
              const dec = safeBase64(raw.slice(5).split(/[#?]/)[0]);
              const m = dec && dec.match(/@([^:@\/]+):(\d+)/);
              host = m ? m[1] + ":" + m[2] : "";
            }
          }
          return { name: name || "کانفیگ بدون نام", host: host };
        }
        function parse(text) {
          const items = [],
            skipped = [];
          text
            .replace(/^\uFEFF/, "")
            .split(/\r\n|\r|\n/)
            .forEach((line, idx) => {
              const raw = line.trim();
              if (!raw || raw.startsWith("#") || raw.startsWith("//")) return;
              let proto;
              if (SCHEME_RE.test(raw))
                proto = raw.slice(0, raw.indexOf("://")).toLowerCase();
              else if (!/\s/.test(raw) && raw.length >= 10) proto = "other";
              else {
                skipped.push({
                  line: idx + 1,
                  text: raw,
                  reason: "شبیه لینک نیست",
                });
                return;
              }
              const d = describe(raw, proto);
              items.push({
                raw: raw,
                proto: proto,
                name: d.name,
                host: d.host,
              });
            });
          return { items: items, skipped: skipped };
        }
        function colorFor(proto) {
          if (PROTO_COLORS[proto]) return PROTO_COLORS[proto];
          let h = 0;
          for (let i = 0; i < proto.length; i++)
            h = (h * 31 + proto.charCodeAt(i)) % 360;
          return "hsl(" + h + " 65% 35%)";
        }

        // ---------- Clipboard + toast ----------
        async function copyText(text) {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text);
              return true;
            }
          } catch (e) {
            /* fall back */
          }
          try {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.cssText = "position:fixed;top:0;opacity:0";
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            ta.setSelectionRange(0, text.length);
            const ok = document.execCommand("copy");
            document.body.removeChild(ta);
            return ok;
          } catch (e) {
            return false;
          }
        }
        function toast(msg) {
          const t = $("toast");
          t.textContent = msg;
          t.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
        }
        async function doCopy(text, btn, original, doneText, toastMsg) {
          const ok = await copyText(text);
          if (!ok) {
            toast("کپی خودکار انجام نشد. لطفاً لینک رو نگه دار و کپی کن.");
            return;
          }
          clearTimeout(btn._t);
          btn.textContent = doneText;
          btn.classList.add("done");
          btn._t = setTimeout(() => {
            btn.textContent = original();
            btn.classList.remove("done");
          }, 2000);
          toast(toastMsg);
        }

        // ---------- Views ----------
        function showOnly(which) {
          $("loading").hidden = which !== "loading";
          $("status").hidden = which !== "status";
          $("list").hidden = which !== "list";
        }
        function setBar(on) {
          $("copyAll").disabled = !on;
          $("search").disabled = !on;
          $("chips").hidden = !on;
        }
        const allLabel = () => "کپی همه " + fa(state.items.length) + " کانفیگ";
        function button(label, cls, fn) {
          const b = el("button", {
            cls: "btn " + cls,
            text: label,
            attrs: { type: "button" },
          });
          b.addEventListener("click", fn);
          return b;
        }
        function panel(emoji, title, text, buttons, isError) {
          const s = $("status");
          clear(s);
          s.appendChild(
            el(
              "div",
              {
                cls: "panel" + (isError ? " error" : ""),
                attrs: { role: isError ? "alert" : "status" },
              },
              [
                el("div", {
                  cls: "emoji",
                  text: emoji,
                  attrs: { "aria-hidden": "true" },
                }),
                el("h2", { text: title }),
                el("p", { text: text }),
                el("div", { cls: "row" }, buttons),
              ],
            ),
          );
          showOnly("status");
        }
        function resetBar(countText) {
          setBar(false);
          $("copyAll").textContent = "کپی همه کانفیگ‌ها";
          $("count").textContent = countText;
          $("updated").hidden = true;
          $("skipped").hidden = true;
        }
        function showError(title, text) {
          state.items = [];
          state.skipped = [];
          resetBar("بارگذاری نشد");
          panel(
            "😕",
            title,
            text,
            [button("↻ دوباره تلاش کن", "primary", load)],
            true,
          );
        }
        function showEmpty() {
          resetBar("۰ کانفیگ");
          panel(
            "📭",
            "فعلاً چیزی اینجا نیست",
            "فایل بارگذاری شد ولی هنوز کانفیگی داخلش نیست. کمی بعد دوباره سر بزن.",
            [button("↻ بارگذاری مجدد", "primary", load)],
            false,
          );
        }
        function showBanner(title, text) {
          const b = $("banner");
          clear(b);
          b.appendChild(el("strong", { text: title }));
          b.appendChild(el("span", { text: text }));
          b.hidden = false;
        }

        // ---------- Rendering ----------
        function renderChips() {
          const box = $("chips");
          clear(box);
          const counts = {},
            order = [];
          state.items.forEach((i) => {
            if (!(i.proto in counts)) {
              counts[i.proto] = 0;
              order.push(i.proto);
            }
            counts[i.proto]++;
          });
          if (state.active !== "all" && !(state.active in counts))
            state.active = "all";
          const make = (key, label) => {
            const c = el("button", {
              cls: "chip",
              text: label,
              attrs: {
                type: "button",
                "aria-pressed": String(state.active === key),
              },
            });
            c.style.setProperty(
              "--c",
              key === "all" ? "var(--accent)" : colorFor(key),
            );
            c.addEventListener("click", () => {
              state.active = key;
              renderChips();
              renderList();
            });
            return c;
          };
          box.appendChild(make("all", "همه (" + fa(state.items.length) + ")"));
          order.forEach((p) =>
            box.appendChild(make(p, labelOf(p) + " (" + fa(counts[p]) + ")")),
          );
        }

        function renderList() {
          const list = $("list");
          clear(list);
          $("clear").hidden = !state.query;
          const q = state.query.trim().toLowerCase();
          const shown = state.items.filter(
            (i) =>
              (state.active === "all" || i.proto === state.active) &&
              (!q ||
                (i.name + " " + i.host + " " + i.proto + " " + i.raw)
                  .toLowerCase()
                  .indexOf(q) !== -1),
          );

          if (!shown.length) {
            panel(
              "🔎",
              "نتیجه‌ای پیدا نشد",
              "چیزی با جستجوی شما جور نیست. کلمه دیگری امتحان کن.",
              [
                button("نمایش همه", "primary", () => {
                  state.active = "all";
                  state.query = "";
                  $("search").value = "";
                  renderChips();
                  renderList();
                }),
              ],
              false,
            );
            return;
          }
          showOnly("list");
          const frag = document.createDocumentFragment();
          shown.forEach((item, idx) => {
            const masked =
              item.raw.length > 48 ? item.raw.slice(0, 48) + "…" : item.raw;
            const btn = el("button", {
              cls: "btn primary",
              text: "کپی",
              attrs: {
                type: "button",
                "aria-label": "کپی کانفیگ " + item.name,
              },
            });
            btn.addEventListener("click", () =>
              doCopy(
                item.raw,
                btn,
                () => "کپی",
                "✓ کپی شد!",
                "کپی شد! حالا در برنامه‌تان جایگذاری کن.",
              ),
            );
            const info = el("div", { cls: "info" }, [
              el("span", { cls: "badge ltr", text: labelOf(item.proto) }),
              el("p", { cls: "name", text: item.name }),
            ]);
            if (item.host)
              info.appendChild(el("p", { cls: "host ltr", text: item.host }));
            info.appendChild(el("p", { cls: "link ltr", text: masked }));
            const card = el(
              "li",
              { cls: "card" + (state.animate ? " rise" : "") },
              [info, btn],
            );
            card.style.setProperty("--c", colorFor(item.proto));
            if (state.animate)
              card.style.setProperty(
                "--i",
                String(7 + Math.min(idx, 10) * 0.35),
              );
            frag.appendChild(card);
          });
          list.appendChild(frag);
          state.animate = false; // animate only the first render, not on every search keystroke
        }

        function renderSkipped() {
          const d = $("skipped");
          if (!state.skipped.length) {
            d.hidden = true;
            return;
          }
          $("skippedSummary").textContent =
            fa(state.skipped.length) + " خط نادیده گرفته شد (جزئیات)";
          const ul = $("skippedList");
          clear(ul);
          state.skipped.slice(0, 50).forEach((s) => {
            const t = s.text.length > 80 ? s.text.slice(0, 80) + "…" : s.text;
            const li = el("li", { text: "خط " + fa(s.line) + ": " });
            li.appendChild(
              el("span", { cls: "ltr", text: t, attrs: { dir: "ltr" } }),
            );
            li.appendChild(document.createTextNode(" (" + s.reason + ")"));
            ul.appendChild(li);
          });
          d.hidden = false;
        }

        function renderAll() {
          $("count").textContent = fa(state.items.length) + " کانفیگ پیدا شد";
          const u = $("updated");
          u.textContent =
            "آخرین دریافت: " +
            new Date().toLocaleTimeString("fa-IR", {
              hour: "2-digit",
              minute: "2-digit",
            });
          u.hidden = false;
          $("copyAll").textContent = allLabel();
          $("copyAll").classList.remove("done");
          setBar(true);
          renderChips();
          renderList();
          renderSkipped();
        }

        // ---------- Loading ----------
        async function load() {
          const my = ++loadId;
          if (controller) controller.abort();
          $("banner").hidden = true;
          $("skipped").hidden = true;

          let url = null;
          if (CONFIG_SOURCE_URL !== PLACEHOLDER) {
            try {
              const u = new URL(CONFIG_SOURCE_URL, location.href);
              if (u.protocol === "https:" || u.protocol === "http:") url = u;
            } catch (e) {
              /* invalid */
            }
          }
          if (!url) {
            state.items = [];
            resetBar("هنوز تنظیم نشده");
            showBanner(
              "منبع کانفیگ تنظیم نشده",
              "صاحب سایت هنوز آدرس فایل کانفیگ‌ها را در کد وارد نکرده است.",
            );
            panel(
              "🛠️",
              "تقریباً آماده‌ایم",
              "به محض تنظیم آدرس، کانفیگ‌ها اینجا نمایش داده می‌شوند.",
              [],
              false,
            );
            return;
          }

          setBar(false);
          $("count").textContent = "در حال بارگذاری…";
          $("updated").hidden = true;
          showOnly("loading");

          const ctl = new AbortController();
          controller = ctl;
          let timedOut = false;
          const timer = setTimeout(() => {
            timedOut = true;
            ctl.abort();
          }, TIMEOUT_MS);
          try {
            url.searchParams.set("_", String(Date.now()));
            const res = await fetch(url.toString(), {
              cache: "no-store",
              signal: ctl.signal,
            });
            if (my !== loadId) return;
            if (res.status === 404) {
              showError(
                "فایل پیدا نشد",
                "ممکن است لینک عوض شده یا فایل حذف شده باشد. کمی بعد دوباره امتحان کن.",
              );
              return;
            }
            if (!res.ok) {
              showError(
                "سرور مشکل دارد",
                "سایتی که کانفیگ‌ها آنجاست درست جواب نداد. چند لحظه صبر کن و دوباره تلاش کن.",
              );
              return;
            }
            const text = await res.text();
            if (my !== loadId) return;
            if (!text.trim()) {
              state.items = [];
              state.skipped = [];
              showEmpty();
              return;
            }
            const r = parse(text);
            state.items = r.items;
            state.skipped = r.skipped;
            state.active = "all";
            state.query = "";
            $("search").value = "";
            if (!r.items.length) {
              showEmpty();
              renderSkipped();
              return;
            }
            renderAll();
          } catch (e) {
            if (my !== loadId) return;
            if (timedOut)
              showError(
                "بیش از حد طول کشید",
                "اینترنت کند است یا سرور جواب نمی‌دهد. اینترنت‌تان را بررسی کن و دوباره تلاش کن.",
              );
            else
              showError(
                "اتصال برقرار نشد",
                "لطفاً اینترنت خود را بررسی کن. اگر اینترنت وصل است، ممکن است سرور فایل در دسترس نباشد.",
              );
          } finally {
            clearTimeout(timer);
          }
        }

        // ---------- Wire up ----------
        $("copyAll").addEventListener("click", () => {
          if (!state.items.length) return;
          const text = state.items.map((i) => i.raw).join("\n"); // original file order, no trailing newline
          doCopy(
            text,
            $("copyAll"),
            allLabel,
            "✓ همه کپی شدن!",
            "همه " + fa(state.items.length) + " کانفیگ کپی شد!",
          );
        });
        $("refresh").addEventListener("click", () => {
          state.animate = false;
          load();
        });
        $("search").addEventListener("input", (e) => {
          state.query = e.target.value;
          renderList();
        });
        $("clear").addEventListener("click", () => {
          state.query = "";
          $("search").value = "";
          renderList();
          $("search").focus();
        });
        $("logo").addEventListener("error", (e) => {
          e.target.parentNode.hidden = true;
        });

        load();
      })();
    </script>
  </body>
</html>
